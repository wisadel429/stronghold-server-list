<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ecebe7" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('rl.theme');
      var t = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* ignore */ }
  })();
</script>
<meta name="description" content="卫戍协议：盟约社区服务器列表，查看在线状态、玩法特色与维护者。" />
<title>卫戍协议：盟约 · 服务器列表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314181a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232f9e63'/%3E%3C/svg%3E" />
<style>
:root{
  /* 直接采用参考站的真实色板（wei.jiangjiangze.icu/style.css） */
  --bg:#ecebe7; --paper:#f7f6f3; --row:#fbfaf8e6; --ink:#141414; --text:#3d3c39; --sub:#6d6c68;
  --line:#cfcdc7; --block:#141414; --on-block:#fff; --block-sub:#a9a8a3; --tag:#e4e2dc;
  --glow:#ffffff; --scan:#ffffff2e; --bar-empty:#d8d6cf; --ok:#3f7d12;
  --orange:#f07d1a; --lime:#9ee03a; --red:#d8432f; --amber:#e3a21a; --shadow:#1414140f;
  --code:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow",var(--mono);
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --sans:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
/* 兼容旧变量名（内部已有规则引用），统一指向参考站色板 */
:root{
  --paper2:var(--paper); --ink2:var(--text); --mute:var(--sub);
  --green:var(--ok); --line2:var(--line);
}
/* 深色主题：变量直接取自参考站 html[data-theme=dark] */
html[data-theme="dark"]{
  --bg:#101113; --paper:#17181b; --row:#16171ae6; --ink:#e9e7e2; --text:#bdbbb5; --sub:#8f8d88;
  --line:#2d2e33; --block:#e4e2dc; --on-block:#111214; --block-sub:#64635f; --tag:#222327;
  --glow:#1c1d21; --shadow:#00000066; --scan:#00000022; --bar-empty:#2a2b30;
  --ok:#a6e35a; --red:#e8634f; --amber:#f0b43a;
  --paper2:var(--paper); --ink2:var(--text); --mute:var(--sub); --green:var(--ok); --line2:var(--line);
}
html[data-theme="dark"] body{background-image:linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),
                   linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px)}
/* 主题切换按钮 */
.rl-theme{display:inline-flex;align-items:center;gap:6px;font:11px/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);background:var(--paper);
  padding:9px 12px;cursor:pointer}
.rl-theme:hover{background:var(--ink);color:var(--on-block)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans);
  background-image:linear-gradient(90deg,rgba(0,0,0,.028) 1px,transparent 1px),
                   linear-gradient(rgba(0,0,0,.028) 1px,transparent 1px);
  background-size:64px 64px}
.shell{max-width:1280px;margin:0 auto;padding:0 28px 46px}

/* 顶栏 */
.rl-top{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:18px 0 14px;border-bottom:2px solid var(--ink)}
.rl-brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.rl-brand b{font:800 18px/1 var(--sans);letter-spacing:.1em}
.rl-brand small{font:9px/1 var(--mono);letter-spacing:.26em;color:var(--mute);margin-top:5px}
.rl-brand span{font:9px/1 var(--mono);letter-spacing:.26em;color:var(--ink2);margin-top:3px}
.rl-brand span b{font-weight:800;font-size:9px;letter-spacing:.26em}
.rl-top-actions{display:flex;align-items:center;gap:8px}
.rl-enter{font:11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  text-decoration:none;border:1px solid var(--ink);padding:9px 14px;background:var(--paper2)}
.rl-enter:hover{background:var(--ink);color:var(--paper)}
.rl-ghost{font:11px/1 var(--mono);letter-spacing:.12em;color:var(--mute);text-decoration:none;
  padding:9px 6px;opacity:.75}
.rl-ghost:hover{opacity:1;color:var(--ink)}

/* 标题 + 统计 */
.rl-hero{padding:22px 0 16px;border-bottom:1px solid var(--line2)}
.rl-code{font:9.5px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.rl-hero h1{margin:8px 0 0;font-size:34px;line-height:1.05;letter-spacing:.01em;font-weight:800}
.rl-hero p{margin:8px 0 0;font-size:12.5px;color:var(--mute);max-width:640px}
.rl-stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.rl-stat b{display:block;font:800 24px/1 var(--mono);color:var(--ink)}
.rl-stat span{display:block;margin-top:5px;font:9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}

/* 筛选 */
.rl-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.rl-chip{padding:6px 13px;border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);
  font-size:12px;cursor:pointer;user-select:none}
.rl-chip:hover{border-color:var(--ink);color:var(--ink)}
.rl-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.rl-search{margin-left:auto;display:flex;gap:8px;align-items:center}
.rl-search input{width:220px;padding:8px 10px;border:1px solid var(--line2);background:#fff;color:var(--ink);
  font:12.5px/1.4 var(--sans);outline:none}
.rl-search input:focus{border-color:var(--ink)}
.rl-refresh{height:34px;padding:0 13px;border:1px solid var(--ink);background:var(--paper2);color:var(--ink);
  font:12.5px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.rl-refresh:hover{background:var(--ink);color:var(--paper)}
.rl-refresh .ico{display:inline-block;font-size:13px;line-height:1}
.rl-refresh.is-busy .ico{animation:spin .8s linear infinite}
.rl-refresh.is-done{background:var(--green);border-color:var(--green);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* 列表：行用参考站的卡片式白底 + 悬停位移 + 橙色角标 */
.rl-list{margin-top:18px;display:grid;gap:10px;border-top:2px solid var(--ink);padding-top:14px}
.rl-row{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr) minmax(280px,360px);
  background:var(--row);border:1px solid var(--line);
  transition:transform .2s,box-shadow .2s,border-color .2s}
.rl-row::before,.rl-row::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--orange);
  opacity:0;transition:opacity .2s;pointer-events:none}
.rl-row::before{top:-5px;right:-5px;border-left:0;border-bottom:0}
.rl-row::after{bottom:-5px;left:-5px;border-right:0;border-top:0}
.rl-row:hover{transform:translateX(4px);border-color:var(--sub);box-shadow:-6px 6px 0 var(--shadow)}
.rl-row:hover::before,.rl-row:hover::after{opacity:1}
.rl-row.is-offline{opacity:.8}
/* 编号块：黑底 88px 宽，数字 38px；右侧 6px 状态条；悬停时块内白光自上而下循环扫描 */
.rl-tile{position:relative;overflow:hidden;background:var(--block);color:var(--on-block);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:12px 4px;font-family:var(--code);height:100%}
.rl-tile small,.rl-tile em{font-size:8px;letter-spacing:.1em;font-style:normal;color:var(--block-sub)}
.rl-tile b{font-size:38px;font-weight:900;line-height:1;margin:4px 0 3px}
.rl-tile::after{content:"";position:absolute;right:0;top:0;width:6px;height:100%;background:var(--sub)}
.rl-row.is-online .rl-tile::after{background:var(--lime)}
.rl-row.is-offline .rl-tile::after{background:var(--red)}
.rl-tile::before{content:"";position:absolute;left:0;right:6px;top:0;height:35%;
  background:linear-gradient(transparent,var(--scan),transparent);transform:translateY(-100%)}
.rl-row:hover .rl-tile::before{animation:rl-scan 1.2s linear infinite}
@keyframes rl-scan{to{transform:translateY(300%)}}
@media (prefers-reduced-motion: reduce){
  .rl-row:hover .rl-tile::before{animation:none}
}
.rl-row.is-offline .rl-tile{background:#8d8880}

.rl-main{min-width:0;padding:14px 18px}
.rl-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rl-title h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.01em}
.rl-dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.rl-row.is-online .rl-dot{background:var(--green)}
.rl-row.is-offline .rl-dot{background:var(--red)}
.rl-tag{font:9px/1 var(--mono);letter-spacing:.12em;padding:3px 5px;border:1px solid currentColor;text-transform:uppercase}
.rl-tag.on{color:var(--green)}
.rl-tag.off{color:var(--red)}
.rl-tag.err{color:#7d6a55;border-style:dashed;text-transform:none;letter-spacing:.02em}
.rl-meta{margin:5px 0 0;font-size:11.5px;color:var(--mute)}
.rl-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.rl-tag2{font-size:10.5px;padding:2px 7px;border:1px solid var(--line);color:var(--ink2);background:var(--paper2)}
.rl-nums{display:flex;gap:20px;margin-top:10px}
.rl-nums span{display:flex;flex-direction:column;gap:1px}
.rl-nums b{font:800 16px/1.05 var(--mono)}
.rl-nums b.dim{color:var(--line2);font-weight:400}
.rl-nums small{font:9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rl-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.rl-btn{height:30px;padding:0 12px;border:1px solid var(--ink);background:var(--paper2);color:var(--ink);
  font:12px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.rl-btn:hover{background:var(--ink);color:var(--paper)}
.rl-btn.primary{background:var(--ink);color:var(--paper);font-weight:700}
.rl-btn.primary:hover{background:var(--green);border-color:var(--green)}
.rl-btn.primary[aria-disabled="true"]{background:transparent;border-color:var(--line2);color:var(--line2);font-weight:400;cursor:default}

/* 右侧：24h 分段条 + 评分 */
.rl-side{border-left:1px dashed var(--line);padding:14px 16px;display:grid;gap:12px;align-content:start}
.rl-hhead{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.rl-hhead b{font:700 13px/1 var(--mono);color:var(--ink)}
.rl-row.is-offline .rl-hhead b{color:var(--sub)}
/* 48 格分段条：参考站用 1px 间隙的 grid，高 22px */
.rl-bars{display:grid;grid-template-columns:repeat(48,1fr);gap:1px;height:22px;margin-top:6px}
.rl-bars i{background:var(--bar-empty);transform-origin:bottom}
.rl-bars i.up{background:#7bc52a}
.rl-bars i.down{background:var(--red)}
.rl-bars i.none{background:var(--bar-empty)}
.rl-hlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:3px}
.rl-vote{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0}
.rl-vote button{position:relative;display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 12px;
  font:700 12px/1 var(--sans);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.rl-vote button b{font:900 19px/1 var(--code)}
.rl-vote button:hover{background:var(--tag)}
.rl-vote button.is-voted{background:var(--ink);color:var(--on-block)}
.rl-vote button.is-voted b{color:var(--on-block)}

.rl-empty{padding:60px 0;text-align:center;color:var(--mute);border-bottom:1px solid var(--line)}
.rl-footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--line2);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.rl-footer b{color:var(--ink2);font-weight:400}

/* 详情 */
dialog.rl-dialog{border:1px solid var(--ink);background:var(--paper2);color:var(--ink);padding:0;
  width:min(640px,94vw);max-height:86vh;box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog.rl-dialog::backdrop{background:rgba(20,24,26,.42)}
.rl-dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px 12px;border-bottom:2px solid var(--ink)}
.rl-dlg-head h2{margin:6px 0 0;font-size:20px;font-weight:800}
.rl-dlg-body{padding:16px 20px;overflow:auto}
.rl-kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:0}
.rl-kv dt{font:9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.rl-kv dd{margin:0;font-size:13px;word-break:break-all}
.rl-notes{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;
  line-height:1.65;color:var(--ink2);white-space:pre-wrap}
.rl-dlg-bars{margin-top:16px}
.rl-dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line)}

#rl-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);opacity:0;
  transition:opacity .18s,transform .18s;background:var(--ink);color:var(--paper);padding:10px 18px;
  font-size:12.5px;pointer-events:none;z-index:99}
#rl-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  .rl-row{grid-template-columns:70px minmax(0,1fr);gap:12px}
  .rl-side{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);padding:12px 0 0;margin-top:4px}
}
@media (max-width:700px){
  .shell{padding:0 14px 32px}
  .rl-hero h1{font-size:25px}
  .rl-hero{padding:16px 0 12px}
  .rl-stats{gap:18px;margin-top:14px}
  .rl-stat b{font-size:19px}
  .rl-search{margin-left:0;width:100%}
  .rl-search input{width:auto;flex:1 1 auto;min-width:0;height:38px}
  .rl-refresh{height:38px}
  .rl-row{padding:14px 0}
  .rl-title h2{font-size:16px}
  .rl-nums{gap:16px}
  .rl-btn{height:36px;font-size:12.5px}
  .rl-side{padding-top:10px}
  .rl-vote{width:100%}
  .rl-vote button{height:34px;font-size:12.5px}
  .rl-kv{grid-template-columns:1fr}
  .rl-footer{flex-direction:column;gap:5px}
  #rl-toast{left:14px;right:14px;transform:translateY(12px);text-align:center}
  #rl-toast.on{transform:translateY(0)}
}
</style>
</head>
<body>
<div class="shell">
  <header class="rl-top">
    <a class="rl-brand" href="/"><b>STRONGHOLD</b><small>SERVER DIRECTORY</small><span>COMMUNITY <b>OS</b></span></a>
    <div class="rl-top-actions">

  </header>

  <section class="rl-hero">

</div>

<dialog class="rl-dialog" id="dlg">

<script>
const $ = (id) => document.getElementById(id);
const state = { items: [], filter: 'all', q: '', stamp: 0 };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad2 = (n) => String(n).padStart(2, '0');
const timeOf = (ms) => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };

function toast(text) {
  const el = $('rl-toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 1800);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }
}

/** 24 小时 → 48 格（不足左侧补灰） */
function barsHtml(points, label) {
  const WANT = 48;
  const pts = Array.isArray(points) ? points.slice(-WANT) : [];
  const pad = Math.max(0, WANT - pts.length);
  let html = '<i class="none"></i>'.repeat(pad);
  html += pts.map((p) => {
    const cls = p[1] == null ? (p[2] === 0 ? 'down' : 'none') : 'up';
    const tip = timeOf(p[0]) + ' · ' + (p[1] == null ? '未连通/未采集' : p[1] + ' 人');
    return '<i class="' + cls + '" title="' + esc(tip) + '"></i>';
  }).join('');
  return '<div class="rl-bars" role="img" aria-label="' + esc(label || '最近 24 小时在线情况') + '">' + html + '</div>';
}

function sparkline(points) {
  const w = 320, h = 34;
  const pts = (Array.isArray(points) ? points : []).filter((p) => p[1] != null);
  if (!pts.length) return '';
  const max = Math.max(1, ...pts.map((p) => p[1]));
  const step = w / Math.max(1, pts.length - 1);
  let d = '', pen = false;
  pts.forEach((p, i) => {
    const x = (i * step).toFixed(1);
    const y = (h - 3 - (p[1] / max) * (h - 6)).toFixed(1);
    d += (pen ? 'L' : 'M') + x + ',' + y; pen = true;
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:34px;display:block;margin-top:8px">' +
    '<path d="' + d + '" fill="none" stroke="#2f9e63" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}

const votedKey = (id) => 'sp.vote.' + id;
function myVote(id) { try { return localStorage.getItem(votedKey(id)) || ''; } catch { return ''; } }

function render() {
  const ordered = state.items.slice().sort((a, b) => {
    const ao = (a.status || {}).state === 'online' ? 0 : 1;
    const bo = (b.status || {}).state === 'online' ? 0 : 1;
    return ao - bo;
  });
  const list = ordered.filter((s) => {
    const st = s.status || {};
    const on = st.state === 'online';
    if (state.filter === 'online' && !on) return false;
    if (state.filter === 'offline' && on) return false;
    if (state.filter === 'busy' && !(st.online > 0)) return false;
    if (state.q) {
      const hay = (s.title + ' ' + s.maintainer + ' ' + (s.tags || []).join(' ') + ' ' + s.region).toLowerCase();
      if (!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });

  const total = state.items.length;
  const online = state.items.filter((s) => (s.status || {}).state === 'online').length;
  const players = state.items.reduce((n, s) => n + (Number((s.status || {}).online) || 0), 0);
  const rooms = state.items.reduce((n, s) => n + (Number((s.status || {}).rooms) || 0), 0);
  $('sOnline').textContent = online;
  $('sTotal').textContent = total;
  $('sPlayers').textContent = players;
  $('sRooms').textContent = rooms;

  const grid = $('grid');
  if (!list.length) { grid.innerHTML = '<div class="rl-empty">没有匹配的服务器</div>'; return; }

  grid.innerHTML = list.map((s) => {
    const st = s.status || {};
    const on = st.state === 'online';
    const idx = state.items.indexOf(s) + 1;
    const num = String(idx).padStart(2, '0');
    const code = 'SRV-' + String(idx).padStart(3, '0');
    const my = myVote(s.id);
    const rt = s.rating || { large: 0, medium: 0 };
    const up = s.uptime24h == null ? '—' : s.uptime24h.toFixed(1) + '%';
    return '<article class="rl-row ' + (on ? 'is-online' : 'is-offline') + '" data-id="' + esc(s.id) + '">' +
      '<div class="rl-tile"><small>NODE</small><b>' + num + '</b><em>' + code + '</em></div>' +
      '<div class="rl-main">' +
        '<div class="rl-title"><span class="rl-dot"></span><h2>' + esc(s.title) + '</h2>' +
          '<span class="rl-tag ' + (on ? 'on' : 'off') + '">' + (on ? '在线' : '离线') + '</span>' +
          (!on && s.error ? '<span class="rl-tag err">' + esc(s.error) + '</span>' : '') +
        '</div>' +
        '<p class="rl-meta">' + esc([s.region, s.maintainer, st.version].filter(Boolean).join(' · ')) + '</p>' +
        ((s.tags && s.tags.length) ? '<div class="rl-tags">' + s.tags.map((t) => '<span class="rl-tag2">' + esc(t) + '</span>').join('') + '</div>' : '') +
        '<div class="rl-nums">' +
          '<span><b class="' + (on && st.online != null ? '' : 'dim') + '">' + (st.online == null ? '—' : st.online) + '</b><small>在线</small></span>' +
          '<span><b class="' + (on ? '' : 'dim') + '">' + (st.rooms == null ? '—' : st.rooms) + '</b><small>房间</small></span>' +
          '<span><b class="' + (on ? '' : 'dim') + '">' + (st.matches == null ? '—' : st.matches) + '</b><small>对局</small></span>' +
          '<span><b class="' + (on ? '' : 'dim') + '">' + (st.latencyMs ? st.latencyMs + 'ms' : '—') + '</b><small>延迟</small></span>' +
        '</div>' +
        '<div class="rl-actions">' +
          '<button type="button" class="rl-btn" data-copy="' + esc(s.url) + '">复制网址</button>' +
          '<button type="button" class="rl-btn" data-detail="' + esc(s.id) + '">详情</button>' +
          '<a class="rl-btn primary" data-go="' + esc(s.url) + '" href="' + esc(s.url) + '" target="_blank" rel="noopener" ' +
            (on ? '' : 'aria-disabled="true" tabindex="-1"') + '>加入网站 ↗</a>' +
        '</div>' +
      '</div>' +
      '<div class="rl-side">' +
        '<div class="rl-hhead"><span>24 小时在线情况（本站探测）</span><b>' + up + '</b></div>' +
        barsHtml(s.history24h, s.title + ' 最近 24 小时') +
        '<div class="rl-hlabels"><span>24 小时前</span><span>12 小时前</span><span>现在</span></div>' +
        '<div class="rl-vote">' +
          '<button type="button" data-vote="large" data-id="' + esc(s.id) + '"' + (my ? ' class="is-voted"' : '') + '><span>超大杯</span> <b>' + (rt.large || 0) + '</b></button>' +
          '<button type="button" data-vote="medium" data-id="' + esc(s.id) + '"' + (my === 'medium' ? ' class="is-voted"' : '') + '><span>中杯</span> <b>' + (rt.medium || 0) + '</b></button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }).join('');
}

async function load() {
  try {
    const r = await fetch('/api/servers', { cache: 'no-store' });
    const j = await r.json();
    state.items = j.servers || [];
    $('pollSec').textContent = j.pollSeconds || 30;
    $('src').textContent = j.probeSource === 'cn' ? '国内节点' : (j.probeSource === 'local' ? '本机' : '—');
    state.stamp = j.lastReportAt || j.serverTime || Date.now();
    paintStamp();
    render();
    return true;
  } catch (e) {
    $('grid').innerHTML = '<div class="rl-empty">读取失败：' + esc(e.message) + '</div>';
    return false;
  }
}

function paintStamp() {
  if (!state.stamp) return;
  const sec = Math.max(0, Math.round((Date.now() - state.stamp) / 1000));
  const rel = sec < 5 ? '刚刚' : sec < 60 ? sec + ' 秒前' : Math.round(sec / 60) + ' 分钟前';
  $('updated').textContent = new Date(state.stamp).toLocaleTimeString() + '（' + rel + '）';
}

function openDetail(id) {
  const s = state.items.find((x) => x.id === id);
  if (!s) return;
  const st = s.status || {};
  const on = st.state === 'online';
  $('dlgCode').textContent = 'NODE DETAIL · ' + (on ? 'ONLINE' : 'OFFLINE');
  $('dlgTitle').textContent = s.title;
  const rows = [
    ['地区', s.region || '—'], ['维护者', s.maintainer || '—'],
    ['版本', st.version || '—'], ['入口', s.url],
    ['在线 / 房间 / 对局', [st.online ?? '—', st.rooms ?? '—', st.matches ?? '—'].join(' / ')],
    ['延迟', st.latencyMs ? st.latencyMs + ' ms' : '—'],
    ['24h / 7d 可用率', (s.uptime24h == null ? '—' : s.uptime24h.toFixed(1) + '%') + ' / ' + (s.uptime7d == null ? '—' : s.uptime7d.toFixed(1) + '%')],
    ['探测源 / 失败原因', (s.source || '—') + (s.error ? ' · ' + s.error : '')],
  ];
  $('dlgKv').innerHTML = rows.map(([k, v]) => '<div><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>').join('');
  const notes = $('dlgNotes');
  notes.hidden = !s.notes;
  notes.textContent = s.notes || '';
  $('dlgBars').innerHTML = barsHtml(s.history24h, s.title + ' 最近 24 小时') + sparkline(s.history24h);
  $('dlgCopy').onclick = async () => { toast(await copyText(s.url) ? '网址已复制' : '复制失败'); };
  const go = $('dlgGo');
  go.href = s.url;
  go.setAttribute('aria-disabled', on ? 'false' : 'true');
  $('dlg').showModal();
}

// 主题切换（明 / 暗），记忆到 localStorage
function paintTheme() {
  const t = document.documentElement.getAttribute('data-theme') || 'light';
  $('themeText').textContent = t === 'dark' ? '日间' : '夜间';
  $('themeBtn').setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#101113' : '#ecebe7');
}
$('themeBtn').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('rl.theme', next); } catch { /* ignore */ }
  paintTheme();
  toast(next === 'dark' ? '已切换到夜间模式' : '已切换到日间模式');
};
paintTheme();

document.querySelectorAll('.rl-chip').forEach((el) => {  el.onclick = () => {
    document.querySelectorAll('.rl-chip').forEach((x) => x.classList.remove('on'));
    el.classList.add('on');
    state.filter = el.dataset.f;
    render();
  };
});
$('q').oninput = (e) => { state.q = e.target.value.trim(); render(); };

$('refreshBtn').onclick = async () => {
  const btn = $('refreshBtn');
  const txt = $('refreshText');
  if (btn.classList.contains('is-busy')) return;
  btn.classList.add('is-busy'); btn.classList.remove('is-done'); btn.disabled = true;
  txt.textContent = '刷新中';
  const t0 = performance.now();
  const ok = await load();
  const wait = Math.max(0, 400 - (performance.now() - t0));
  if (wait) await new Promise((r) => setTimeout(r, wait));
  btn.classList.remove('is-busy'); btn.disabled = false;
  if (ok) {
    btn.classList.add('is-done'); txt.textContent = '已刷新';
    const sec = state.stamp ? Math.max(0, Math.round((Date.now() - state.stamp) / 1000)) : 0;
    toast('已取到最新数据（数据 ' + (sec < 60 ? sec + ' 秒前' : Math.round(sec / 60) + ' 分钟前') + '）');
    setTimeout(() => { btn.classList.remove('is-done'); txt.textContent = '刷新'; }, 1600);
  } else {
    txt.textContent = '刷新失败'; toast('刷新失败，请检查网络');
    setTimeout(() => { txt.textContent = '刷新'; }, 1800);
  }
};

$('grid').addEventListener('click', async (ev) => {
  const el = ev.target.closest ? ev.target.closest('[data-copy],[data-detail],[data-vote]') : null;
  if (!el) return;

  const cp = el.getAttribute('data-copy');
  if (cp) { toast(await copyText(cp) ? '网址已复制' : '复制失败，请手动复制'); return; }

  const dt = el.getAttribute('data-detail');
  if (dt) { openDetail(dt); return; }

  const kind = el.getAttribute('data-vote');
  const id = el.getAttribute('data-id');
  if (kind && id) {
    if (myVote(id)) { toast('今天已经给这个服投过票了'); return; }
    try {
      const r = await fetch('/api/vote', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id, kind }),
      });
      const j = await r.json();
      if (!r.ok) { toast(j.error || '投票失败'); return; }
      try { localStorage.setItem(votedKey(id), kind); } catch { /* ignore */ }
      const s = state.items.find((x) => x.id === id);
      if (s) s.rating = { large: j.large, medium: j.medium };
      render();
      toast(kind === 'large' ? '已投：超大杯' : '已投：中杯');
    } catch { toast('投票失败，请检查网络'); }
  }
});

$('grid').addEventListener('click', (ev) => {
  const a = ev.target.closest ? ev.target.closest('a[data-go][aria-disabled="true"]') : null;
  if (a) { ev.preventDefault(); toast('这个服当前探测失败，可以先「复制网址」自行确认'); }
}, true);

$('dlgClose').onclick = () => $('dlg').close();
$('dlg').addEventListener('click', (ev) => { if (ev.target === $('dlg')) $('dlg').close(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('dlg').open) $('dlg').close(); });

load();
setInterval(load, 15000);
setInterval(paintStamp, 5000);
</script>
</body>
</html>
