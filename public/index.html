<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#070b09" />
<meta name="description" content="卫戍协议：盟约社区服务器列表，查看在线状态、玩法特色与维护者。" />
<title>卫戍协议：盟约 · 服务器列表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b09'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2335d07f'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#070b09; --panel:#0b110d; --panel2:#0d1310; --line:#1d2a22; --line2:#263a2d;
  --text:#e8f2ea; --mut:#7f9488; --dim:#5d6f64;
  --green:#35d07f; --mint:#7bf0b0; --amber:#d8a94a; --red:#e05a4f;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --sans:"Microsoft YaHei","Noto Sans SC","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--text);background:var(--bg);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 18% -8%,rgba(28,74,52,.5),transparent 62%),
             radial-gradient(760px 460px at 92% 108%,rgba(16,52,38,.42),transparent 66%),
             linear-gradient(180deg,#0a100c 0%,var(--bg) 52%,#060a08 100%)}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.42;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),
             radial-gradient(120% 90% at 50% 48%,transparent 52%,rgba(0,0,0,.55) 100%)}
.shell{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:26px 26px 40px}

/* ── 顶栏 ───────────────────────────────────────────── */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;letter-spacing:.06em;font-weight:800}
.eyebrow{font:10px/1 var(--mono);letter-spacing:.22em;color:var(--dim);margin-bottom:8px}
.sub{color:var(--mut);font-size:11.5px;letter-spacing:.16em;font-family:var(--mono);margin-top:6px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.admin-link{align-self:flex-end;font:10.5px/1 var(--mono);letter-spacing:.1em;color:var(--dim);
  text-decoration:none;padding:4px 8px;border:1px solid transparent;border-radius:6px;
  opacity:.55;transition:opacity .15s,color .15s,border-color .15s}
.admin-link:hover,.admin-link:focus-visible{opacity:1;color:var(--mint);border-color:var(--line2);
  background:rgba(53,208,127,.06);outline:none}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{min-width:78px}
.stat b{display:block;font:700 20px/1.1 var(--mono);color:var(--mint)}
.stat span{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin-top:4px}

/* ── 筛选栏 ─────────────────────────────────────────── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px;align-items:center}
.chip{padding:5px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2);
  color:var(--mut);font-size:12px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--green);color:var(--text)}
.chip.on{border-color:rgba(53,208,127,.65);color:var(--mint);background:rgba(53,208,127,.1)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px}
.search input{width:210px;padding:6px 10px;border-radius:7px;border:1px solid var(--line2);
  background:#080d0a;color:var(--text);font:12.5px/1.4 var(--sans);outline:none}
.search input:focus{border-color:rgba(53,208,127,.6)}
.refresh{height:34px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--mut);font:12.5px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.refresh:hover{border-color:var(--green);color:var(--text)}
.refresh:disabled{cursor:default}
.refresh .ico{display:inline-block;font-size:13px;line-height:1}
.refresh.is-busy{color:var(--mint);border-color:rgba(53,208,127,.6)}
.refresh.is-busy .ico{animation:spin .8s linear infinite}
.refresh.is-done{color:var(--mint);border-color:rgba(53,208,127,.75);background:rgba(53,208,127,.12)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 列表（横排一行一服）─────────────────────────────── */
.list{margin-top:14px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 300px;gap:18px;
  padding:16px 4px;border-bottom:1px solid var(--line);position:relative}
.row:hover{background:rgba(53,208,127,.025)}
.row::before{content:"";position:absolute;left:-4px;top:14px;bottom:14px;width:2px;background:transparent}
.row.online::before{background:var(--green);box-shadow:0 0 12px rgba(53,208,127,.55)}
.row.offline::before{background:var(--red)}

/* 编号块（参考图里的 NODE 01 / SRV-001） */
.tile{background:#080d0a;border:1px solid var(--line);border-left:2px solid var(--line2);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  padding:8px 10px;height:76px}
.row.online .tile{border-left-color:var(--green)}
.row.offline .tile{border-left-color:var(--red)}
.tile small{font:8.5px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
.tile strong{font:800 26px/1 var(--mono);color:var(--text);margin:4px 0 3px;letter-spacing:-.02em}
.tile em{font:9px/1 var(--mono);letter-spacing:.12em;color:var(--dim);font-style:normal}

.rmain{min-width:0}
.rtitle{display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.row.online .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.row.offline .dot{background:var(--red)}
.rtitle h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:.02em}
.state{font:9.5px/1 var(--mono);letter-spacing:.12em;padding:3px 6px;border-radius:3px;border:1px solid currentColor}
.row.online .state{color:var(--green)}
.row.offline .state{color:var(--red)}
.meta{margin:5px 0 0;font-size:11.5px;color:var(--mut)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
.nums{display:flex;gap:18px;margin-top:10px}
.nums span{display:flex;flex-direction:column;gap:1px}
.nums b{font:700 16px/1.05 var(--mono);color:var(--text)}
.nums b.dim{color:var(--dim);font-weight:400}
.nums small{font-size:9.5px;letter-spacing:.1em;color:var(--dim)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.btn{height:29px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--mut);font:12px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.btn:hover{border-color:var(--green);color:var(--text)}
.btn.primary{border-color:rgba(53,208,127,.7);background:rgba(53,208,127,.14);color:var(--mint);font-weight:700}
.btn.primary[aria-disabled="true"]{border-color:var(--line2);background:transparent;color:var(--dim);font-weight:400;cursor:default}
.badge-off{font:9.5px/1 var(--mono);letter-spacing:.1em;color:var(--dim);border:1px dashed var(--line2);
  padding:3px 6px;border-radius:3px}

/* 右侧：24h 分段条 + 评分 */
.rside{border-left:1px dashed var(--line);padding-left:16px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.hhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hhead span{font:9.5px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.hhead b{font:700 13px/1 var(--mono);color:var(--mint)}
.row.offline .hhead b{color:var(--dim)}
.bars{display:flex;gap:2px;height:16px;align-items:stretch}
.bars i{flex:1 1 auto;min-width:2px;border-radius:1px;background:#1b2620}
.bars i.up{background:rgba(53,208,127,.75)}
.bars i.down{background:rgba(224,90,79,.7)}
.bars i.none{background:#151d18}
.vote{display:flex;gap:7px}
.vote button{flex:1 1 0;height:27px;border-radius:6px;border:1px solid var(--line2);background:#080d0a;
  color:var(--mut);font:11.5px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.vote button b{font:700 12px/1 var(--mono);color:var(--text)}
.vote button:hover{border-color:var(--green);color:var(--text)}
.vote button.is-voted{border-color:rgba(53,208,127,.7);background:rgba(53,208,127,.12);color:var(--mint)}
.vote button.is-voted b{color:var(--mint)}

.empty{padding:60px 0;text-align:center;color:var(--dim);border-top:1px solid var(--line)}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);
  font-size:11.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer b{color:var(--mut);font-weight:400}

/* 详情弹层 */
dialog.dlg{border:1px solid var(--line2);border-radius:12px;background:linear-gradient(180deg,#0c1410,#080d0a);
  color:var(--text);padding:0;width:min(620px,92vw);max-height:84vh;box-shadow:0 30px 80px rgba(0,0,0,.7)}
dialog.dlg::backdrop{background:rgba(3,6,5,.78)}
.dlg__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg__eyebrow{font:9.5px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
.dlg__title{margin:6px 0 0;font-size:18px;font-weight:800}
.dlg__body{padding:14px 18px;overflow:auto}
.dlg__kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
.dlg__kv div{min-width:0}
.dlg__kv dt{font-size:10px;letter-spacing:.1em;color:var(--dim);margin-bottom:2px}
.dlg__kv dd{margin:0;font-size:13px;color:var(--text);word-break:break-all}
.dlg__notes{margin-top:14px;font-size:12.5px;line-height:1.6;color:var(--mut);white-space:pre-wrap;
  border-top:1px dashed var(--line);padding-top:10px}
.dlg__bars{margin-top:14px}
.dlg__foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);opacity:0;
  transition:opacity .18s,transform .18s;background:#0f1a14;border:1px solid rgba(53,208,127,.55);
  color:var(--mint);padding:9px 18px;border-radius:9px;font-size:12.5px;pointer-events:none;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 手机 ───────────────────────────────────────────── */
@media (max-width:900px){
  .row{grid-template-columns:76px minmax(0,1fr);gap:12px;padding:13px 2px}
  .rside{grid-column:1 / -1;border-left:0;border-top:1px dashed var(--line);padding:10px 0 0;margin-top:2px;
    display:flex;flex-direction:column;gap:8px}
  .rside .vote{width:100%}
  .tile{height:auto;padding:7px 8px}
  .tile strong{font-size:21px}
}
@media (max-width:820px){
  body{-webkit-tap-highlight-color:transparent}
  .shell{padding:16px 13px calc(26px + env(safe-area-inset-bottom))}
  header{gap:12px;padding-bottom:12px;align-items:flex-start}
  h1{font-size:19px}
  .eyebrow{font-size:9px;letter-spacing:.18em;margin-bottom:6px}
  .sub{font-size:10.5px;letter-spacing:.1em;margin-top:4px}
  .hdr-right{width:100%;align-items:stretch;gap:4px}
  .admin-link{align-self:flex-end;opacity:.6;padding:2px 6px}
  .stats{gap:6px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);margin-top:2px}
  .stat{min-width:0}
  .stat b{font-size:17px}
  .stat span{font-size:9px;letter-spacing:.08em;margin-top:2px;white-space:nowrap}
  .filters{gap:6px;margin:14px 0 2px}
  .chip{padding:7px 13px;font-size:12.5px}
  .search{margin-left:0;width:100%}
  .search input{width:auto;flex:1 1 auto;min-width:0;height:38px;font-size:14px;border-radius:8px}
  .refresh{height:38px;padding:0 13px;font-size:13px;flex:0 0 auto}
  .rtitle h3{font-size:15.5px}
  .btn{height:36px;padding:0 13px;font-size:13px}
  .vote button{height:34px;font-size:12.5px}
  .nums{gap:14px}
  .nums b{font-size:15px}
  .dlg__kv{grid-template-columns:1fr}
  footer{flex-direction:column;gap:5px;font-size:11px;margin-top:20px;padding-top:12px}
  #toast{left:13px;right:13px;width:auto;transform:translateY(12px);text-align:center;
    font-size:13px;padding:11px 14px;bottom:calc(16px + env(safe-area-inset-bottom))}
  #toast.on{transform:translateY(0)}
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <div class="eyebrow">STRONGHOLD PROTOCOL · ALLIANCE</div>
      <h1>卫戍协议 · 服务器列表</h1>
      <div class="sub">SERVER STATUS · 每 <span id="pollSec">30</span> 秒自动刷新</div>
    </div>
    <div class="hdr-right">
      <a class="admin-link" href="/admin" title="管理后台（需要口令）">⚙ 后台</a>
      <div class="stats">
        <div class="stat"><b id="sOnline">–</b><span>在线服</span></div>
        <div class="stat"><b id="sTotal">–</b><span>收录总数</span></div>
        <div class="stat"><b id="sPlayers">–</b><span>在线玩家</span></div>
        <div class="stat"><b id="sRooms">–</b><span>房间</span></div>
      </div>
    </div>
  </header>

  <div class="filters">
    <div class="chip on" data-f="all">全部</div>
    <div class="chip" data-f="online">在线</div>
    <div class="chip" data-f="offline">离线</div>
    <div class="chip" data-f="busy">有玩家</div>
    <div class="search">
      <input id="q" placeholder="搜索服名 / 维护者 / 标签…" autocomplete="off" />
      <button type="button" class="refresh" id="refreshBtn" title="立即刷新数据">
        <span class="ico" aria-hidden="true">↻</span><span id="refreshText">刷新</span>
      </button>
    </div>
  </div>

  <div class="list" id="grid"><div class="empty">正在读取…</div></div>

  <footer>
    <span>数据来自各服 <b>/healthz</b> · 探测源 <b id="src">—</b> · 超时 8 秒视为离线 · 24 小时分段 = 每 30 分钟一格</span>
    <span>更新于 <b id="updated">–</b></span>
  </footer>
</div>

<dialog class="dlg" id="dlg">
  <div class="dlg__head">
    <div>
      <div class="dlg__eyebrow" id="dlgEyebrow">NODE DETAIL</div>
      <h2 class="dlg__title" id="dlgTitle">—</h2>
    </div>
    <button type="button" class="btn" id="dlgClose">关闭</button>
  </div>
  <div class="dlg__body">
    <dl class="dlg__kv" id="dlgKv"></dl>
    <div class="dlg__notes" id="dlgNotes" hidden></div>
    <div class="dlg__bars" id="dlgBars"></div>
  </div>
  <div class="dlg__foot">
    <button type="button" class="btn" id="dlgCopy">复制网址</button>
    <a class="btn primary" id="dlgGo" target="_blank" rel="noopener">加入网站 ↗</a>
  </div>
</dialog>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { items: [], filter: 'all', q: '', stamp: 0 };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad2 = (n) => String(n).padStart(2, '0');
const timeOf = (ms) => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 1800);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }
}

/** 24 小时 → 48 格分段条：绿=在线、红=失败、灰=无数据（不足 48 格左侧补灰，保证刻度一致） */
function barsHtml(points, label) {
  const WANT = 48;
  const pts = Array.isArray(points) ? points.slice(-WANT) : [];
  const pad = Math.max(0, WANT - pts.length);
  let html = '<i class="none"></i>'.repeat(pad);
  html += pts.map((p) => {
    const cls = p[1] == null ? (p[2] === 0 ? 'down' : 'none') : 'up';
    const tip = timeOf(p[0]) + ' · ' + (p[1] == null ? '未连通/未采集' : p[1] + ' 人');
    return '<i class="' + cls + '" title="' + esc(tip) + '"></i>';
  }).join('');
  return '<div class="bars" role="img" aria-label="' + esc(label || '最近 24 小时在线情况') + '">' + html + '</div>';
}

/** 详情里的折线（保留一个缩小版） */
function sparkline(points) {
  const w = 320, h = 34;
  const pts = (Array.isArray(points) ? points : []).filter((p) => p[1] != null);
  if (!pts.length) return '';
  const max = Math.max(1, ...pts.map((p) => p[1]));
  const step = w / Math.max(1, pts.length - 1);
  let d = '', pen = false;
  pts.forEach((p, i) => {
    const x = (i * step).toFixed(1);
    const y = (h - 3 - (p[1] / max) * (h - 6)).toFixed(1);
    d += (pen ? 'L' : 'M') + x + ',' + y; pen = true;
  });
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:34px;display:block;margin-top:8px">' +
    '<path d="' + d + '" fill="none" stroke="rgba(53,208,127,.9)" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}

const votedKey = (id) => 'sp.vote.' + id;
function myVote(id) { try { return localStorage.getItem(votedKey(id)) || ''; } catch { return ''; } }

function render() {
  // 保留 order 原序，连接失败的置底（sort 稳定）
  const ordered = state.items.slice().sort((a, b) => {
    const ao = (a.status || {}).state === 'online' ? 0 : 1;
    const bo = (b.status || {}).state === 'online' ? 0 : 1;
    return ao - bo;
  });
  const list = ordered.filter((s) => {
    const st = s.status || {};
    const on = st.state === 'online';
    if (state.filter === 'online' && !on) return false;
    if (state.filter === 'offline' && on) return false;
    if (state.filter === 'busy' && !(st.online > 0)) return false;
    if (state.q) {
      const hay = (s.title + ' ' + s.maintainer + ' ' + (s.tags || []).join(' ') + ' ' + s.region).toLowerCase();
      if (!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });

  const total = state.items.length;
  const online = state.items.filter((s) => (s.status || {}).state === 'online').length;
  const players = state.items.reduce((n, s) => n + (Number((s.status || {}).online) || 0), 0);
  const rooms = state.items.reduce((n, s) => n + (Number((s.status || {}).rooms) || 0), 0);
  $('sOnline').textContent = online;
  $('sTotal').textContent = total;
  $('sPlayers').textContent = players;
  $('sRooms').textContent = rooms;

  const grid = $('grid');
  if (!list.length) { grid.innerHTML = '<div class="empty">没有匹配的服务器</div>'; return; }

  grid.innerHTML = list.map((s, i) => {
    const st = s.status || {};
    const on = st.state === 'online';
    const code = 'SRV-' + String(state.items.indexOf(s) + 1).padStart(3, '0');
    const num = String(state.items.indexOf(s) + 1).padStart(2, '0');
    const my = myVote(s.id);
    const rt = s.rating || { large: 0, medium: 0 };
    const up = s.uptime24h == null ? '—' : s.uptime24h.toFixed(1) + '%';
    return '<article class="row ' + (on ? 'online' : 'offline') + '" data-id="' + esc(s.id) + '">' +
      '<div class="tile"><small>NODE</small><strong>' + num + '</strong><em>' + code + '</em></div>' +
      '<div class="rmain">' +
        '<div class="rtitle"><span class="dot"></span><h3>' + esc(s.title) + '</h3>' +
          '<span class="state">' + (on ? '在线' : '离线') + '</span>' +
          (!on && s.error ? '<span class="badge-off">' + esc(s.error) + '</span>' : '') +
        '</div>' +
        '<p class="meta">' + esc([s.region, s.maintainer, st.version].filter(Boolean).join(' · ')) + '</p>' +
        ((s.tags && s.tags.length) ? '<div class="tags">' + s.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' : '') +
        '<div class="nums">' +
          '<span><b class="' + (on && st.online != null ? '' : 'dim') + '">' + (st.online == null ? '—' : st.online) + '</b><small>在线</small></span>' +
          '<span><b class="' + (on ? '' : 'dim') + '">' + (st.rooms == null ? '—' : st.rooms) + '</b><small>房间</small></span>' +
          '<span><b class="' + (on ? '' : 'dim') + '">' + (st.matches == null ? '—' : st.matches) + '</b><small>对局</small></span>' +
          '<span><b class="' + (on ? '' : 'dim') + '">' + (st.latencyMs ? st.latencyMs + 'ms' : '—') + '</b><small>延迟</small></span>' +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn" data-copy="' + esc(s.url) + '">复制网址</button>' +
          '<button type="button" class="btn" data-detail="' + esc(s.id) + '">详情</button>' +
          '<a class="btn primary" data-go="' + esc(s.url) + '" href="' + esc(s.url) + '" target="_blank" rel="noopener" ' +
            (on ? '' : 'aria-disabled="true" tabindex="-1"') + '>加入网站 ↗</a>' +
        '</div>' +
      '</div>' +
      '<div class="rside">' +
        '<div class="hhead"><span>24 小时在线（本站探测）</span><b>' + up + '</b></div>' +
        barsHtml(s.history24h, s.title + ' 最近 24 小时') +
        '<div class="vote">' +
          '<button type="button" data-vote="large" data-id="' + esc(s.id) + '"' + (my ? ' class="is-voted"' : '') + '>超大杯 <b>' + (rt.large || 0) + '</b></button>' +
          '<button type="button" data-vote="medium" data-id="' + esc(s.id) + '"' + (my === 'medium' ? ' class="is-voted"' : '') + '>中杯 <b>' + (rt.medium || 0) + '</b></button>' +
        '</div>' +
      '</div>' +
    '</article>';
  }).join('');
}

async function load() {
  try {
    const r = await fetch('/api/servers', { cache: 'no-store' });
    const j = await r.json();
    state.items = j.servers || [];
    $('pollSec').textContent = j.pollSeconds || 30;
    $('src').textContent = j.probeSource === 'cn' ? '国内节点' : (j.probeSource === 'local' ? '本机' : '—');
    state.stamp = j.lastReportAt || j.serverTime || Date.now();
    paintStamp();
    render();
    return true;
  } catch (e) {
    $('grid').innerHTML = '<div class="empty">读取失败：' + esc(e.message) + '</div>';
    return false;
  }
}

function paintStamp() {
  if (!state.stamp) return;
  const sec = Math.max(0, Math.round((Date.now() - state.stamp) / 1000));
  const rel = sec < 5 ? '刚刚' : sec < 60 ? sec + ' 秒前' : Math.round(sec / 60) + ' 分钟前';
  $('updated').textContent = new Date(state.stamp).toLocaleTimeString() + '（' + rel + '）';
}

// ---- 详情 ----
function openDetail(id) {
  const s = state.items.find((x) => x.id === id);
  if (!s) return;
  const st = s.status || {};
  const on = st.state === 'online';
  $('dlgEyebrow').textContent = 'NODE DETAIL · ' + (on ? 'ONLINE' : 'OFFLINE');
  $('dlgTitle').textContent = s.title;
  const rows = [
    ['地区', s.region || '—'], ['维护者', s.maintainer || '—'],
    ['版本', st.version || '—'], ['入口', s.url],
    ['在线 / 房间 / 对局', [st.online ?? '—', st.rooms ?? '—', st.matches ?? '—'].join(' / ')],
    ['延迟', st.latencyMs ? st.latencyMs + ' ms' : '—'],
    ['24h / 7d 可用率', (s.uptime24h == null ? '—' : s.uptime24h.toFixed(1) + '%') + ' / ' + (s.uptime7d == null ? '—' : s.uptime7d.toFixed(1) + '%')],
    ['探测源 / 失败原因', (s.source || '—') + (s.error ? ' · ' + s.error : '')],
  ];
  $('dlgKv').innerHTML = rows.map(([k, v]) => '<div><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>').join('');
  const notes = $('dlgNotes');
  notes.hidden = !s.notes;
  notes.textContent = s.notes || '';
  $('dlgBars').innerHTML = barsHtml(s.history24h, s.title + ' 最近 24 小时') + sparkline(s.history24h);
  $('dlgCopy').onclick = async () => { toast(await copyText(s.url) ? '网址已复制' : '复制失败'); };
  const go = $('dlgGo');
  go.href = s.url;
  go.setAttribute('aria-disabled', on ? 'false' : 'true');
  $('dlg').showModal();
}

// ---- 事件 ----
document.querySelectorAll('.chip').forEach((el) => {
  el.onclick = () => {
    document.querySelectorAll('.chip').forEach((x) => x.classList.remove('on'));
    el.classList.add('on');
    state.filter = el.dataset.f;
    render();
  };
});
$('q').oninput = (e) => { state.q = e.target.value.trim(); render(); };

$('refreshBtn').onclick = async () => {
  const btn = $('refreshBtn');
  const txt = $('refreshText');
  if (btn.classList.contains('is-busy')) return;
  btn.classList.add('is-busy'); btn.classList.remove('is-done'); btn.disabled = true;
  txt.textContent = '刷新中';
  const t0 = performance.now();
  const ok = await load();
  const wait = Math.max(0, 400 - (performance.now() - t0));
  if (wait) await new Promise((r) => setTimeout(r, wait));
  btn.classList.remove('is-busy'); btn.disabled = false;
  if (ok) {
    btn.classList.add('is-done'); txt.textContent = '已刷新';
    const sec = state.stamp ? Math.max(0, Math.round((Date.now() - state.stamp) / 1000)) : 0;
    toast('已取到最新数据（数据 ' + (sec < 60 ? sec + ' 秒前' : Math.round(sec / 60) + ' 分钟前') + '）');
    setTimeout(() => { btn.classList.remove('is-done'); txt.textContent = '刷新'; }, 1600);
  } else {
    txt.textContent = '刷新失败'; toast('刷新失败，请检查网络');
    setTimeout(() => { txt.textContent = '刷新'; }, 1800);
  }
};

$('grid').addEventListener('click', async (ev) => {
  const el = ev.target.closest ? ev.target.closest('[data-copy],[data-detail],[data-vote]') : null;
  if (!el) return;

  // 复制网址
  const cp = el.getAttribute('data-copy');
  if (cp) { toast(await copyText(cp) ? '网址已复制' : '复制失败，请手动复制'); return; }

  // 详情
  const dt = el.getAttribute('data-detail');
  if (dt) { openDetail(dt); return; }

  // 评分
  const kind = el.getAttribute('data-vote');
  const id = el.getAttribute('data-id');
  if (kind && id) {
    if (myVote(id)) { toast('今天已经给这个服投过票了'); return; }
    try {
      const r = await fetch('/api/vote', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id, kind }),
      });
      const j = await r.json();
      if (!r.ok) { toast(j.error || '投票失败'); return; }
      try { localStorage.setItem(votedKey(id), kind); } catch { /* ignore */ }
      const s = state.items.find((x) => x.id === id);
      if (s) s.rating = { large: j.large, medium: j.medium };
      render();
      toast(kind === 'large' ? '已投：超大杯' : '已投：中杯');
    } catch { toast('投票失败，请检查网络'); }
  }
});

// 离线的「加入网站」不可点：链接有 aria-disabled
$('grid').addEventListener('click', (ev) => {
  const a = ev.target.closest ? ev.target.closest('a[data-go][aria-disabled="true"]') : null;
  if (a) { ev.preventDefault(); toast('这个服当前探测失败，可以先「复制网址」自行确认'); }
}, true);

$('dlgClose').onclick = () => $('dlg').close();
$('dlg').addEventListener('click', (ev) => { if (ev.target === $('dlg')) $('dlg').close(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('dlg').open) $('dlg').close(); });

load();
setInterval(load, 15000);
setInterval(paintStamp, 5000);
</script>
</body>
</html>
