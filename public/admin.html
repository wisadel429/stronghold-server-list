<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>服务器列表 · 管理</title>
<style>
:root{--bg:#070b09;--panel:#0b110d;--panel2:#0d1310;--line:#1d2a22;--line2:#263a2d;--text:#e8f2ea;--mut:#7f9488;--dim:#5d6f64;--green:#35d07f;--mint:#7bf0b0;--red:#e05a4f;--mono:"Cascadia Mono",Consolas,monospace;--sans:"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--text);background:var(--bg);font:14px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 18% -8%,rgba(28,74,52,.45),transparent 62%),linear-gradient(180deg,#0a100c,var(--bg) 60%,#060a08)}
.shell{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:24px 24px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:19px;letter-spacing:.05em}
.eyebrow{font:10px/1 var(--mono);letter-spacing:.22em;color:var(--dim);margin-bottom:7px}
.sub{color:var(--mut);font:11px/1.4 var(--mono);margin-top:6px}
.btn{height:31px;padding:0 14px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;font-size:12.5px}
.btn:hover{border-color:var(--green)}
.btn--primary{border-color:rgba(53,208,127,.8);background:rgba(53,208,127,.16);color:var(--mint);font-weight:700}
.btn--danger:hover{border-color:var(--red);color:var(--red)}
#login{max-width:420px;margin:80px auto;padding:26px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
#login h2{margin:0 0 6px;font-size:16px}
#login p{margin:0 0 16px;color:var(--mut);font-size:12.5px}
input[type=password],input[type=text],textarea,select{width:100%;padding:7px 9px;border-radius:6px;border:1px solid var(--line2);background:#080d0a;color:var(--text);font:12.5px/1.4 var(--sans);outline:none}
input:focus,textarea:focus{border-color:rgba(53,208,127,.6)}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:12.5px;table-layout:auto}
th,td{padding:7px 8px;border-bottom:1px solid rgba(29,42,34,.85);vertical-align:middle;text-align:left}
th{font:10.5px/1.2 var(--mono);letter-spacing:.12em;color:var(--dim);white-space:nowrap;font-weight:400}
tr:hover td{background:rgba(53,208,127,.03)}
td input,td textarea{background:#060b08}
td textarea{height:36px;min-height:36px;max-height:36px;resize:none;overflow:auto;line-height:1.35}
.w-40{width:56px}.w-90{width:90px}.w-140{width:150px}.w-180{width:185px}.w-220{width:225px}
.acts{display:flex;gap:6px;flex-wrap:nowrap}
.acts .btn{height:26px;padding:0 9px;font-size:11.5px;white-space:nowrap}
.state{font:10.5px/1 var(--mono);padding:3px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.state.on{color:var(--green)}.state.off{color:var(--red)}
.state.offline{color:var(--dim)}
.hint{color:var(--dim);font-size:11.5px;margin-top:10px}
.msg{margin-top:10px;font-size:12px;min-height:18px;color:var(--mint)}
.msg.err{color:var(--red)}
footer{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <div class="eyebrow">STRONGHOLD LIST · ADMIN</div>
      <h1>服务器列表 · 管理</h1>
      <div class="sub">改动直接写回 servers.json 并立即重新探测</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="btnDeploy" title="服务器上执行 git pull，代码有变化时自动重启">更新到最新版</button>
      <button class="btn" id="btnReload">刷新状态</button>
      <button class="btn btn--primary" id="btnNew">＋ 新增服务器</button>
    </div>
  </header>

  <section id="login" hidden>
    <h2>需要口令</h2>
    <p>口令来自环境变量 <code>ADMIN_PASSWORD</code>（没设置时会随机生成并打印在启动日志里）。</p>
    <input type="password" id="pw" placeholder="管理口令" autocomplete="current-password" />
    <div style="margin-top:12px"><button class="btn btn--primary" id="btnLogin">登录</button></div>
    <div class="msg err" id="loginMsg"></div>
  </section>

  <main id="main" hidden>
    <div class="msg" id="msg"></div>
    <div style="overflow:auto">
      <table>
        <thead><tr>
          <th class="w-40">序</th><th class="w-180">名称</th><th class="w-140">地区</th><th class="w-120">维护者</th>
          <th class="w-220">入口地址</th><th class="w-120">状态路径</th><th class="w-180">标签（逗号分隔）</th>
          <th>备注</th><th class="w-90">状态</th><th class="w-140">操作</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="hint">提示：改完点该行「保存」；「下架」只是把 <code>enabled</code> 设为 false（保留配置）；删除不可恢复。</div>
  </main>

  <footer>每 30 秒自动探测一次 · 页面上的「状态」是最近一次探测结果</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let dirty = false;

async function api(path, body) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, { ...opt, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || '未登录'); }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function showLogin() { $('login').hidden = false; $('main').hidden = true; }
function showMain() { $('login').hidden = true; $('main').hidden = false; }

function say(text, err) {
  const el = $('msg');
  el.textContent = text || '';
  el.className = 'msg' + (err ? ' err' : '');
}

function rowHtml(s) {
  const st = s.status || {};
  const on = st.state === 'online';
  const stateText = on ? '在线' : (st.state === 'unreachable' ? '不可达' : '离线');
  return '<tr data-id="' + esc(s.id) + '">' +
    '<td><input type="text" class="w-40" data-k="order" value="' + esc(s.order) + '" /></td>' +
    '<td><input type="text" data-k="title" value="' + esc(s.title) + '" /></td>' +
    '<td><input type="text" data-k="region" value="' + esc(s.region) + '" /></td>' +
    '<td><input type="text" data-k="maintainer" value="' + esc(s.maintainer) + '" /></td>' +
    '<td><input type="text" data-k="url" value="' + esc(s.url) + '" /></td>' +
    '<td><input type="text" data-k="statusPath" value="' + esc(s.statusPath) + '" /></td>' +
    '<td><input type="text" data-k="tags" value="' + esc((s.tags || []).join('、')) + '" /></td>' +
    '<td><textarea data-k="notes">' + esc(s.notes) + '</textarea></td>' +
    '<td><span class="state ' + (on ? 'on' : (st.state === 'unreachable' ? 'offline' : 'off')) + '">' + stateText + '</span></td>' +
    '<td><div class="acts">' +
      '<button class="btn" data-act="save">保存</button>' +
      '<button class="btn" data-act="toggle">' + (s.enabled === false ? '上架' : '下架') + '</button>' +
      '<button class="btn btn--danger" data-act="del">删除</button>' +
    '</div></td>' +
  '</tr>';
}

async function load() {
  const j = await api('/admin/api/list');
  const list = (j.servers || []).slice().sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
  $('rows').innerHTML = list.map(rowHtml).join('') || '<tr><td colspan="10" class="hint">还没有收录任何服务器，点右上角「新增服务器」</td></tr>';
  showMain();
  say('已载入 ' + list.length + ' 条');
}

function readRow(tr, id) {
  const get = (k) => tr.querySelector('[data-k="' + k + '"]').value;
  return {
    id,
    order: Number(get('order')) || 99,
    title: get('title'), region: get('region'), maintainer: get('maintainer'),
    url: get('url'), statusPath: get('statusPath'), tags: get('tags'), notes: get('notes'),
  };
}

$('btnLogin').onclick = async () => {
  try {
    await api('/admin/login', { password: $('pw').value });
    $('loginMsg').textContent = '';
    await load();
  } catch (e) { $('loginMsg').textContent = e.message; }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnLogin').click(); });

$('btnReload').onclick = () => load().catch((e) => say(e.message, true));

$('btnDeploy').onclick = async () => {
  if (!confirm('在服务器上执行 git pull？如果 server.mjs 有变化会自动重启服务（约 3 秒）。')) return;
  const btn = $('btnDeploy');
  btn.disabled = true;
  btn.textContent = '更新中…';
  try {
    const r = await api('/admin/api/deploy', {});
    const files = (r.changed || []).join('、') || '（无变化）';
    say(`更新完成 ${r.before || '?'} → ${r.after || '?'} · 变更：${files}${r.restarted ? ' · 服务重启中…' : ''}`);
    if (r.restarted) setTimeout(() => location.reload(), 5000);
    else await load();
  } catch (e) {
    say('更新失败：' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '更新到最新版';
  }
};

$('btnNew').onclick = async () => {
  const name = prompt('新服务器名称（例如：十五服）');
  if (!name) return;
  const url = prompt('入口地址（http:// 或 https:// 开头）');
  if (!url) return;
  try {
    const r = await api('/admin/api/save', { title: name, url, statusPath: '/healthz', order: 99 });
    await load();
    say('已新增 ' + name + '（id ' + r.id + '）');
  } catch (e) { say('新增失败：' + e.message, true); }
};

$('rows').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  const tr = btn.closest('tr');
  const id = tr.getAttribute('data-id');
  const act = btn.getAttribute('data-act');
  try {
    if (act === 'save') {
      const row = readRow(tr, id);
      await api('/admin/api/save', row);
      say('已保存 ' + row.title + '，正在重新探测…');
      setTimeout(() => load().catch(() => {}), 2500);
    } else if (act === 'toggle') {
      const enabling = btn.textContent.trim() === '上架';
      await api('/admin/api/toggle', { id, enabled: enabling });
      await load();
      say(enabling ? '已上架' : '已下架（配置保留）');
    } else if (act === 'del') {
      if (!confirm('删除这条？不可恢复（可用「下架」代替）。')) return;
      await api('/admin/api/delete', { id });
      await load();
      say('已删除');
    }
  } catch (e) { say(e.message, true); }
});

$('rows').addEventListener('input', () => { dirty = true; });
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

load().catch(() => showLogin());
</script>
</body>
</html>
